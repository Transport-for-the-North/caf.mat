zone_system: noham_v3.8
time_period_factors:
  1: 3
  2: 6
  3: 3
  4: 12

postme_folder: .temp\postme
postme_segmentation:
  enum_segments:
    - userclass
    - tp
    - m
  naming_order:
    - m
    - tp
    - userclass
  subsets:
    m:
      - 3
    tp:
      - 1
      - 2
      - 3
      - 4

synthetic_folder: .temp\synthetic

# Parameters defining the phi factors CSV columns and the corresponding segment
phi_factors:
  path: I:\NTS\outputs\productions\hb\phi_factors\tour_proportions_PA_reg.csv
  # Column names and their corresponding segment
  segment_columns:
    purpose.fr: p
    mode: m
  data_column: trips.est
  segment_translation:
    p: userclass

occupancy_factors:
  path: I:\NTS\outputs\occs\vehicle_occupancy_sum_direction_int.csv
  # All column names and their corresponding segment
  segment_columns:
    purpose: p
    direction: direction_od
    period: tp
  segment_translation:
    p: userclass
