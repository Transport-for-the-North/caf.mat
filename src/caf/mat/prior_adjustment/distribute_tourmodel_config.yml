# ============================================================
# distribute.py - main() configuration
# ============================================================

# ------------------------------------------------------------------
# Segment subsets
# Filters applied to mode, timeperiod, purpose, and direction across all inputs.
# Each value can be a single integer or a list of integers.
# Full available ranges:
#   mode:       1-8
#   timeperiod: 1-8
#   purpose:    1-8, 11-18
#   direction:  0-2  (0=nhb, 1=hb_fr, 2=hb_to)
# ------------------------------------------------------------------
mode_subset:
  - 6
timeperiod_subset:
  - 1
  - 2
  - 3
  - 4
purpose_subset:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  - 8
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 17
  - 18
direction_subset:
  - 0
  - 1
  - 2

# ------------------------------------------------------------------
# TLD lookup file (zone-to-TLD-area mapping)
# ------------------------------------------------------------------
tld_lookup:
  path: I:\NorMITs Distribution\voa_gb_2023_uni\NorMITs_zone.csv
  cat_col: "tld_area"
  zone_col: ";normits_v3.3_id"

# ------------------------------------------------------------------
# Zoning systems (names passed to cb.ZoningSystem.get_zoning())
# ------------------------------------------------------------------
zone_system: normits
sector_system: tour_sector

# ------------------------------------------------------------------
# Zone-to-sector lookup CSV
# columns: list of column names to assign after loading (in order)
# ------------------------------------------------------------------
zone_to_sector_lookup:
  path: D:\TM_Adjusted_Emp\NorMITs Demand_Nhan\NoTEM\inputs\normits_v3.3_noham_v3.8_trans.csv
  columns:
    - noham_v3.8_id
    - normits_v3.3_id
    - noham_v3.8_to_normits_v3.3_spatial
    - normits_v3.3_to_noham_v3.8_spatial
    - noham_v3.8_to_normits_v3.3_emp
    - normits_v3.3_to_noham_v3.8_emp
    - noham_v3.8_to_normits_v3.3_pop
    - normits_v3.3_to_noham_v3.8_pop
    - internal
    - lad17
    - cty17
    - tfn_ca
    - gor
    - lad_agg
    - cty_agg
    - tour
  index_column: normits_v3.3_id
  req_sector_column: tour


# ------------------------------------------------------------------
# Sector Target Files (MatrixFiles)
# naming_order: segment order used to generate filenames
# ------------------------------------------------------------------
adj_target_matrices:
  naming_order:
    - m
    - p
    - tp
    - direction_od
  # folder_path: D:\TM_Adjusted_Emp\NorMITs Demand_Nhan\NoTEM\tripend\sectors_moira
  # filename_template: "sec_{slice_name}.csv"
  # folder_path: I:\NorTMS rebase\10. distributions\phase_3_sectors
  # filename_template: "p3_mat_{slice_name}"
  folder_path: I:\NorTMS rebase\10. distributions\phase_4_sectors_v2
  filename_template: "p3_mat_{slice_name}"
  #"tourmodel_{type}_{slice_name}.csv"
  furness: False

# ------------------------------------------------------------------
# read_4dcons function flag and its inputs
# This function was mainly during rail distribution, to adjust
# the sector target matrices with MOIRA data
# ------------------------------------------------------------------
read_4dcons_function:
  flag: False
  adjustment_type: "moira" # moira or wavelength
  level: "tour" # tour or gor
  input_files: D:\TM_Adjusted_Emp\NorMITs Demand_Nhan\NoTEM\tripend
  adj_files: I:\NorMITs Distribution\voa_gb_2023_uni_i1\iter3a_rail_only\inputs
  output_path: D:\TM_Adjusted_Emp\NorMITs Demand_Nhan\NoTEM\tripend\sectors_moira

# ------------------------------------------------------------------
# Cost files (MatrixFiles)
# ------------------------------------------------------------------
cost_files:
  naming_order:
    - m
    - tp
  # folder_path: I:\Prior adjustment\distribution\costs
  # filename_template: "normits_costs_{slice_name}.csv"
  # folder_path: I:\NorTMS rebase\13. Zone to Station Mapping\output_walk_car_5_closest_5_min_penalty_RAIL_SPEED_X2\matrix_creation\Costs
  # filename_template: "rail_costs_{slice_name}.csv"
  folder_path: I:\Prior adjustment\distribution\costs\Rail_Adjusted
  filename_template: "railadjusted_normits_costs_{slice_name}.csv"

# ------------------------------------------------------------------
# Comparison cost files (MatrixFiles)
# These will be used to adjust the seed matrix based on the ratio of
# the main mode cost files.
# ------------------------------------------------------------------
comparison_cost_files:
  check: False
  naming_order:
    - m
    - tp
  mode: 3
  folder_path: I:\Prior adjustment\distribution\costs
  filename_template: "normits_costs_{slice_name}.csv"
  steepness: 0.0

# ------------------------------------------------------------------
# Trip Length Distribution files
# naming_order: segment order used to generate filenames (p, direction_od)
# filename_template: template for TLD filenames. Note: the generated
#   slice name has direction strings substituted before use:
#   "fr" -> "hb_fr", "to" -> "hb_to"  (e.g. p1_fr -> filled_p1_hb_fr.csv)
# ------------------------------------------------------------------
tld_files:
  naming_order:
    - m
    - p
    - direction_od
  folder_path: D:\distribute_inputs\TLDs
  filename_template: "NTS_tld_{slice_name}.csv"
  travelled_distance_column: "trav_dist"
  cat_col: ";index"
  max_col: "trav_dist"
  trips_col: "trips"

# ------------------------------------------------------------------
# Trip end input files (.dvec format)
# Only the paths relevant to the direction_od subsets above are loaded.
#   direction_od=0 -> prod_nhb / attr_nhb
#   direction_od=1 -> hb_prod_fr / hb_attr_fr
#   direction_od=2 -> hb_prod_to / hb_attr_to
# ------------------------------------------------------------------
trip_ends:
  prod_nhb:   I:\NorTMS rebase\9. Tripends\4.0\orig\nhb_normits_tem_segmented_fr.dvec
  attr_nhb:   I:\NorTMS rebase\9. Tripends\4.0\dest\nhb_normits_tem_segmented_fr.dvec
  hb_prod_fr: I:\NorTMS rebase\9. Tripends\4.0\orig\hb_normits_tem_segmented_fr.dvec
  hb_attr_fr: I:\NorTMS rebase\9. Tripends\4.0\dest\hb_normits_tem_segmented_fr.dvec
  hb_prod_to: I:\NorTMS rebase\9. Tripends\4.0\orig\hb_normits_tem_segmented_to.dvec
  hb_attr_to: I:\NorTMS rebase\9. Tripends\4.0\dest\hb_normits_tem_segmented_to.dvec

# ------------------------------------------------------------------
# Gravity model run name (used for output folder naming)
# ------------------------------------------------------------------
gm_run_name: rail_hwy_TE4.0_20261015_v2

# ------------------------------------------------------------------
# Output directory for all results
# ------------------------------------------------------------------
output_path: D:\rail_hwy_TE4.0_20261015_v2

# ------------------------------------------------------------------
# Run options
# run_gm:     if false, loads existing overall_matrix.csv instead of calibrating
# run_adjust: if true, runs the furness adjustment after the GM step
# ------------------------------------------------------------------
run_options:
  run_gm: False
  run_adjust: True

# ------------------------------------------------------------------
# Adjustment target options
# apply:   whether to include this target in the furness adjustment
# max_cap: maximum cap applied to the adjustment factor
# ------------------------------------------------------------------
adj_target_options:
  triple_targ:
    apply: False
    max_cap: 5
  o_target:
    apply: False
    max_cap: 10
  d_target:
    apply: False
    max_cap: 10
  sec_target:
    apply: True
    max_cap: 5

# ------------------------------------------------------------------
# Maximum number of parallel processes
# Recommendations:
#   2 for full runs (RAM can spike to 50-60 GB)
#   3-4 for testing individual time periods
# Note: automatically set to 0 (serial) when run_gm is false
# ------------------------------------------------------------------
max_process: 4

# ------------------------------------------------------------------
# CA/NCA disaggregation stage (dia/distribute.py)
# Runs after the gravity model/adjustment stage above, further
# disaggregating the resulting matrices to car availability segmentation.
# ------------------------------------------------------------------
ca_disaggregation:
  run: True
  tlds_path: I:\NorTMS rebase\10. distributions\tlds\combined_tlds_canca_new.csv

